server:
  port: 8080 # The Standard Public Entry Point

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        # Auth Service (Public)
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**

        # Product Service (Public - Usually browsing is free)
        - id: product-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/products/**

        # Inventory Service (Public check, but updating should be restricted later)
        - id: inventory-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/inventory/**

        # Cart Service (PROTECTED)
        - id: cart-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/cart/**
          filters:
            - AuthenticationFilter

        # Order Service (PROTECTED)
        - id: order-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - AuthenticationFilter